<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kxsis Proxy Browser</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #0d0d0d; color: #fff; -webkit-user-select: none; user-select: none; }
    header { background: #1b1b1b; padding: 20px; text-align: center; font-size: 2rem; font-weight: bold; }

    /* Responsive flex layout */
    #controls, #advanced {
      display: flex;
      gap: 10px;
      padding: 15px;
      background: #111;
      flex-wrap: wrap;
    }

    input, select {
      padding: 12px;
      border-radius: 10px;
      border: none;
      flex: 1;
      font-size: 1rem;
    }

    button {
      padding: 12px 18px;
      border-radius: 10px;
      background: #3b82f6;
      color: #fff;
      cursor: pointer;
      transition: .2s;
      font-size: 1rem;
    }
    button:hover { background: #60a5fa; }

    #frameContainer { height: calc(100vh - 330px); }
    iframe { width: 100%; height: 100%; border: none; background: #000; }

    textarea {
      width: 100%;
      height: 200px;
      background: #111;
      color: #fff;
      border-radius: 10px;
      border: none;
      padding: 15px;
      font-size: 1rem;
    }

    /* Full cross-platform scaling */
    @media (max-width: 768px) {
      header { font-size: 1.5rem; }
      button, input, select { font-size: .9rem; padding: 10px; }
      #frameContainer { height: calc(100vh - 380px); }
      textarea { height: 150px; }
    }

    /* iPhone notch support */
    body { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
  </style>
</head>
<body>
  <header>Kxsis Proxy Browser</header>

  <div id="controls">
    <input id="urlInput" placeholder="Enter URL..." />
    <button onclick="go()">Go</button>
    <button onclick="fetchSource()">Fetch Source</button>
    <button onclick="useRaw()">Raw Mode</button>
    <button onclick="addBookmark()">★ Bookmark</button>
    <button onclick="toggleBookmarks()">📚 Bookmarks</button>
  </div>

  <div id="advanced">
    <select id="charset">
      <option value="">Charset: Default</option>
      <option value="ISO-8859-1">ISO-8859-1</option>
      <option value="UTF-8">UTF-8</option>
    </select>
    <select id="mode">
      <option value="raw">Raw (iframe)</option>
      <option value="get">GET Mode (JSON)</option>
      <option value="jsonp">JSONP Callback</option>
    </select>
  </div>

  <div id="frameContainer">
    <iframe id="proxyFrame"></iframe>
  </div>

  <h3 style="padding-left:15px">Source Output</h3>
  <textarea id="sourceBox" placeholder="Fetched source will appear here..."></textarea>

  <h3 style="padding-left:15px">Bookmarks</h3>
  <textarea id="bookmarkBox" placeholder="Bookmarks... (click bookmark button to add)"></textarea>

  <script>
    const baseRaw = "https://api.allorigins.win/raw?url=";
    const baseGet = "https://api.allorigins.win/get?url=";
    const baseJSONP = "https://api.allorigins.win/get?callback=myFunc&url=";

    function formatURL(url) {
      return url.startsWith("http") ? url : "https://" + url;
    }

    function buildURL(url) {
      const charset = document.getElementById("charset").value;
      const mode = document.getElementById("mode").value;

      let encoded = encodeURIComponent(formatURL(url));
      let finalURL = "";

      if (mode === "raw") finalURL = baseRaw + encoded;
      else if (mode === "get") finalURL = baseGet + encoded;
      else if (mode === "jsonp") finalURL = baseJSONP + encoded;

      if (charset) finalURL += `&charset=${charset}`;

      return finalURL;
    }

    function go() {
      const url = document.getElementById("urlInput").value;
      if (!url) return;
      document.getElementById("proxyFrame").src = buildURL(url);
    }

    async function fetchSource() {
      const url = document.getElementById("urlInput").value;
      if (!url) return;

      const apiURL = buildURL(url).replace("/raw?", "/get?");

      const res = await fetch(apiURL);
      const json = await res.json();
      document.getElementById("sourceBox").value = json.contents;
    }

    function useRaw() {
      document.getElementById("mode").value = "raw";
      go();
    }

    function addBookmark() {
      const box = document.getElementById("bookmarkBox");
      const url = document.getElementById("urlInput").value;
      if (url) box.value += `
${url}`;
    }

    function toggleBookmarks() {
      const box = document.getElementById("bookmarkBox");
      box.style.display = box.style.display === "none" ? "block" : "none";
    }
  </script>
</body>
</html>
