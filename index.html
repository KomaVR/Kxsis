<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Proxy Protected Browser</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: #fff;
    }
    header {
      background: #1a1a1a;
      padding: 20px;
      text-align: center;
      font-size: 1.8rem;
      font-weight: bold;
      box-shadow: 0 0 10px #000;
    }
    #controls {
      display: flex;
      gap: 10px;
      padding: 15px;
      background: #111;
      box-shadow: 0 0 5px #000 inset;
    }
    #urlInput {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: none;
      outline: none;
      font-size: 1rem;
    }
    button {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background: #3b82f6;
      color: white;
      cursor: pointer;
      font-size: 1rem;
      transition: 0.2s;
    }
    button:hover {
      background: #60a5fa;
    }
    #frameContainer {
      width: 100%;
      height: calc(100vh - 130px);
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #000;
    }
    #toolbar {
      display: flex;
      gap: 10px;
      padding: 10px;
      background: #131313;
      align-items: center;
      justify-content: center;
      border-top: 1px solid #222;
    }
    .tool-btn {
      background: #272727;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header>Proxy Protected Web Browser</header>

  <div id="controls">
    <input id="urlInput" placeholder="Enter a URL..." />
    <button onclick="loadSite()">Go</button>
    <button onclick="loadGoogle()">Google</button>
    <button onclick="toggleDark()">Dark/Light</button>
    <button onclick="clearFrame()">Clear</button>
  </div>

  <div id="frameContainer">
    <iframe id="proxyFrame"></iframe>
  </div>

  <div id="toolbar">
    <button class="tool-btn" onclick="historyBack()">← Back</button>
    <button class="tool-btn" onclick="historyForward()">Forward →</button>
    <button class="tool-btn" onclick="refreshFrame()">⟳ Refresh</button>
  </div>

  <script>
    const proxyBase = "https://api.cors.lol/?url=";

    function formatURL(u) {
      if (!u.startsWith("http")) return "https://" + u;
      return u;
    }

    function loadSite() {
      const url = document.getElementById("urlInput").value;
      if (!url) return;
      const proxied = proxyBase + encodeURIComponent(formatURL(url));
      document.getElementById("proxyFrame").src = proxied;
    }

    function loadGoogle() {
      document.getElementById("proxyFrame").src = proxyBase + encodeURIComponent("https://google.com");
    }

    function toggleDark() {
      document.body.classList.toggle("light");
      if (document.body.classList.contains("light")) {
        document.body.style.background = "#fafafa";
        document.body.style.color = "#000";
      } else {
        document.body.style.background = "#0f0f0f";
        document.body.style.color = "#fff";
      }
    }

    function clearFrame() {
      document.getElementById("proxyFrame").src = "about:blank";
    }

    function historyBack() {
      document.getElementById("proxyFrame").contentWindow.history.back();
    }

    function historyForward() {
      document.getElementById("proxyFrame").contentWindow.history.forward();
    }

    function refreshFrame() {
      const frame = document.getElementById("proxyFrame");
      frame.src = frame.src;
    }
  </script>
</body>
</html>
