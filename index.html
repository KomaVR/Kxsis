<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proxy Site</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        .container {
            width: 80%;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            margin-top: 50px;
        }
        h1 {
            text-align: center;
        }
        .input-group {
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
        }
        .input-group input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }
        .button-group {
            text-align: center;
        }
        .button-group button {
            padding: 10px 20px;
            background-color: #007BFF;
            color: #fff;
            border: none;
            cursor: pointer;
        }
        .button-group button:hover {
            background-color: #0056b3;
        }
        iframe {
            width: 100%;
            height: 600px;
            border: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Proxy Site</h1>
        <div class="input-group">
            <label for="url">Enter the URL you want to access:</label>
            <input type="text" id="url" placeholder="https://example.com">
        </div>
        <div class="button-group">
            <button onclick="loadProxy()">Access Site</button>
        </div>
        <iframe id="proxyFrame"></iframe>
    </div>

    <script>
        function loadProxy() {
            var url = document.getElementById('url').value;
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'http://' + url;
            }
            var proxyUrl = 'https://api.cors.lol/?url=' + encodeURIComponent(url);
            document.getElementById('proxyFrame').src = proxyUrl;
        }
    </script>
</body>
</html>
