<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Kxsis Proxy Browser — Vercel</title>
<meta name="description" content="Kxsis — Proxy Browser with multi-engine support, navigation shim and secure blob rendering." />
<link rel="icon" href="/favicon.svg" />
<style>
  /* (trimmed styling for brevity — keep the polished styles you liked) */
  :root{ --bg:#071029; --accent1:#6ea8fe; --accent2:#8b5cf6; --muted:#9fb0c8; --radius:12px; }
  html,body{height:100%;margin:0;background:linear-gradient(180deg,var(--bg),#03040a);font-family:Inter,system-ui,Segoe UI,Roboto,Arial;color:#e6f2ff}
  .container{max-width:1280px;margin:18px auto;padding:18px;border-radius:12px;background:rgba(255,255,255,0.01)}
  header{display:flex;align-items:center;gap:12px}
  .logo{width:48px;height:48px;border-radius:10px;background:linear-gradient(135deg,var(--accent1),var(--accent2));display:flex;align-items:center;justify-content:center;color:#021428;font-weight:700}
  .controls{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}
  .urlbar{flex:1;display:flex;align-items:center;background:#0f1724;padding:8px;border-radius:10px}
  .urlbar input{flex:1;background:transparent;border:0;padding:8px 10px;color:inherit}
  button{padding:8px 12px;border-radius:8px;border:none;background:linear-gradient(90deg,var(--accent1),var(--accent2));cursor:pointer}
  .main{display:grid;grid-template-columns:1fr 360px;gap:16px;margin-top:14px}
  .viewer{border-radius:10px;overflow:hidden;background:#000;border:1px solid rgba(255,255,255,0.03);min-height:60vh;position:relative}
  iframe{width:100%;height:100%;border:0}
  .panel{padding:12px;border-radius:10px;background:linear-gradient(180deg,rgba(255,255,255,0.01),transparent)}
  textarea{width:100%;height:220px;background:#07101a;border-radius:8px;border:1px solid rgba(255,255,255,0.02);padding:10px;color:#dceefb}
  .mini{background:transparent;border:1px solid rgba(255,255,255,0.03);padding:8px;border-radius:8px;color:var(--muted)}
  @media(max-width:980px){ .main{grid-template-columns:1fr} }
</style>
</head>
<body>
  <div class="container">
    <header><div class="logo">KX</div><div><h1>Kxsis Proxy Browser</h1><div style="color:#9fb0c8">Vercel edition</div></div></header>

    <div class="controls">
      <div class="urlbar">
        <input id="urlInput" placeholder="https://example.com or example.com" />
        <select id="engineSelect" style="margin-left:8px">
          <option value="service">Rewriter (fast)</option>
          <option value="raw">Raw (passthrough)</option>
          <option value="croxy">Croxy (embed)</option>
        </select>
        <select id="renderMode" style="margin-left:8px">
          <option value="blob">Blob</option>
          <option value="iframe">Iframe (raw)</option>
        </select>
        <button id="goBtn">Go</button>
      </div>

      <div style="display:flex;gap:6px">
        <button id="backBtn" class="mini">←</button>
        <button id="forwardBtn" class="mini">→</button>
        <button id="refreshBtn" class="mini">⟳</button>
        <button id="bookmarkBtn" class="mini">★</button>
      </div>
    </div>

    <div class="main">
      <div>
        <div class="viewer" id="viewer">
          <iframe id="proxyFrame" sandbox="allow-scripts allow-forms"></iframe>
        </div>
        <div style="margin-top:8px;color:#9fb0c8">Tip: Blob mode isolates pages and lets the rewriter inject navigation shims.</div>
      </div>

      <aside class="panel">
        <h3>Inspector & Controls</h3>
        <input id="searchInput" placeholder="Search (DuckDuckGo)" style="width:100%;padding:8px;border-radius:8px;background:#071018;border:1px solid rgba(255,255,255,0.02);color:inherit" />
        <div style="display:flex;gap:8px;margin-top:8px">
          <button id="searchBtn" class="mini">Search</button>
          <button id="openNewBtn" class="mini">Open external</button>
        </div>

        <div style="margin-top:12px;color:#9fb0c8">Source / Debug</div>
        <textarea id="sourceBox" readonly placeholder="Fetched source appears here (trimmed)"></textarea>

        <div style="margin-top:12px;display:flex;justify-content:space-between;align-items:center">
          <div style="color:#9fb0c8">Bookmarks</div>
          <button id="exportBookmark" class="mini">Export</button>
        </div>
        <div id="bookmarkList" style="margin-top:8px;max-height:200px;overflow:auto"></div>
      </aside>
    </div>
  </div>

<script>
/* Frontend simplified: calls your Vercel endpoints:
   - /api/service?url=...  -> HTML rewriter (recommended)
   - /api/resource?url=... -> resource proxy (rewritten pages will reference these)
   - /api/raw?url=...      -> raw passthrough
*/

const $ = id => document.getElementById(id);
const ENGINES = {
  service: u => `/api/service?url=${encodeURIComponent(u)}`,
  raw: u => `/api/raw?url=${encodeURIComponent(u)}`,
  croxy: u => `https://www.croxyproxy.com/embed/?url=${encodeURIComponent(u)}`
};

function formatURL(u){ if(!u) return ''; u = u.trim(); return /^\w+:\/\//.test(u) ? u : 'https://' + u }

async function loadURL(raw){
  if(!raw) return;
  const url = formatURL(raw);
  $('urlInput').value = url;

  const engineKey = $('engineSelect').value;
  const mode = $('renderMode').value;
  try{
    if(mode === 'iframe' && engineKey !== 'service'){
      // raw iframe mode / external embed
      $('proxyFrame').src = ENGINES[engineKey](url);
      return;
    }

    // preferred: ask /api/service (rewriter) which returns fully rewritten HTML
    if(engineKey === 'service'){
      const endpoint = ENGINES.service(url);
      $('sourceBox').value = 'Fetching via rewriter...';
      const res = await fetch(endpoint);
      if(!res.ok) throw new Error('rewriter fetch failed: ' + res.status);
      const html = await res.text();
      $('sourceBox').value = html.slice(0,200000);
      // load as blob in iframe
      const blobUrl = URL.createObjectURL(new Blob([html], {type:'text/html'}));
      $('proxyFrame').sandbox = 'allow-scripts allow-forms';
      $('proxyFrame').src = blobUrl;
      return;
    }

    // fallback to raw
    $('proxyFrame').src = ENGINES[engineKey](url);
  }catch(err){
    console.error(err);
    $('sourceBox').value = 'Load failed: ' + err.message;
    window.open(url, '_blank');
  }
}

// UI wiring
$('goBtn').addEventListener('click', ()=> loadURL($('urlInput').value));
$('urlInput').addEventListener('keydown', e => { if(e.key === 'Enter') loadURL($('urlInput').value) });
$('searchBtn').addEventListener('click', ()=> { const q = $('searchInput').value.trim(); if(q) loadURL('https://duckduckgo.com/?q=' + encodeURIComponent(q)); });
$('openNewBtn').addEventListener('click', ()=> { const u = formatURL($('urlInput').value); if(u) window.open(u,'_blank'); });

/* Bookmarks simple */
let bookmarks = JSON.parse(localStorage.getItem('kxsis:bookmarks')||'[]');
function renderBookmarks(){ const el = $('bookmarkList'); el.innerHTML=''; bookmarks.forEach(u => { const d = document.createElement('div'); d.style.padding='6px'; d.innerHTML = `<div style="display:flex;justify-content:space-between;gap:8px"><div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${u}</div><div><button class="mini open">Open</button><button class="mini copy">Copy</button></div></div>`; d.querySelector('.open').addEventListener('click', ()=> loadURL(u)); d.querySelector('.copy').addEventListener('click', ()=> navigator.clipboard.writeText(u)); el.appendChild(d); }) }
$('bookmarkBtn').addEventListener('click', ()=> { const u = formatURL($('urlInput').value); if(u && !bookmarks.includes(u)){ bookmarks.unshift(u); localStorage.setItem('kxsis:bookmarks', JSON.stringify(bookmarks)); renderBookmarks(); }});
renderBookmarks();

</script>
</body>
</html>
