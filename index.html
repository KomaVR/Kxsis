<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Kxsis Proxy Browser — Glass Neo (Dynamic-Fixed Hybrid)</title>

<!-- Glass Neo theme (patched) -->
<style>
  :root{
    --bg1:#05070d; --bg2:#0a0f16;
    --cardGlass: rgba(255,255,255,0.06);
    --cardBorder: rgba(255,255,255,0.12);
    --text:#e8f2ff; --muted:#9fb0c8;
    --accent1:#6ea8fe; --accent2:#8b5cf6;
    --radius:14px; --blur:20px;
    --viewer-min-vh: 64; /* min height in vh (Dynamic-Fixed Hybrid) */
    --viewer-max-vh: 82; /* max height in vh */
  }

  html,body{
    height:100%;
    margin:0;
    background:linear-gradient(180deg,var(--bg1),var(--bg2));
    font-family:Inter, system-ui, "Segoe UI", Roboto, Arial, sans-serif;
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }

  .container{
    max-width:1400px;
    margin:20px auto;
    padding:20px;
    border-radius:var(--radius);
    background:var(--cardGlass);
    backdrop-filter: blur(var(--blur));
    -webkit-backdrop-filter: blur(var(--blur));
    border:1px solid var(--cardBorder);
    box-sizing:border-box;
  }

  header{display:flex;align-items:center;gap:14px}
  .logo{width:52px;height:52px;border-radius:12px;background:linear-gradient(135deg,var(--accent1),var(--accent2));display:flex;align-items:center;justify-content:center;color:#021428;font-weight:700;font-size:20px; box-shadow:0 6px 18px rgba(0,0,0,0.28)}
  h1{margin:0;font-size:20px;line-height:1}
  .subtitle{color:var(--muted);font-size:13px;margin-top:4px}

  .controls{margin-top:18px;display:flex;flex-wrap:wrap;gap:14px;align-items:center}
  .urlbar{flex:1;display:flex;align-items:center;background:rgba(255,255,255,0.04);backdrop-filter: blur(6px);-webkit-backdrop-filter: blur(6px);border-radius:12px;padding:10px;border:1px solid rgba(255,255,255,0.06)}
  .urlbar input{flex:1;background:transparent;border:0;padding:10px 12px;color:var(--text);font-size:15px;outline:none}
  select{padding:7px 10px;border-radius:10px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);color:var(--muted);font-size:13px;margin-left:8px}
  .btn{padding:8px 14px;border-radius:10px;border:0;background:linear-gradient(90deg,var(--accent1),var(--accent2));color:#021428;font-weight:600;cursor:pointer;box-shadow:0 6px 12px rgba(0,0,0,0.25);margin-left:10px}
  .mini{padding:7px 10px;border-radius:10px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);color:var(--muted);cursor:pointer}

  .main{margin-top:18px;display:grid;grid-template-columns:1fr 420px;gap:18px}
  @media(max-width:1100px){ .main{grid-template-columns:1fr 360px} }
  @media(max-width:880px){ .main{grid-template-columns:1fr} }

  /* Viewer container + Safari-proof dynamic sizing */
  .viewer{
    position:relative;
    width:100%;
    height:calc(var(--viewer-min-vh) * 1vh); /* initial conservative fallback */
    min-height:180px; /* absolute fallback */
    border-radius:12px;
    overflow:hidden;
    background:#000;
    border:1px solid rgba(255,255,255,0.08);
    box-shadow: 0 8px 28px rgba(0,0,0,0.35);
  }

  /* iframe must be absolutely positioned (fixes many iOS issues) */
  #proxyFrame{
    position:absolute;
    top:0;left:0;right:0;bottom:0;
    width:100%;height:100%;
    border:0;background:white;display:block;
    -webkit-overflow-scrolling:touch;
  }

  .status{position:absolute;left:12px;bottom:12px;color:var(--muted);font-size:13px;text-shadow:0 0 8px rgba(0,0,0,0.4)}
  .panel{border-radius:12px;padding:14px;background:var(--cardGlass);border:1px solid var(--cardBorder);backdrop-filter: blur(var(--blur));-webkit-backdrop-filter: blur(var(--blur))}
  textarea{width:100%;height:140px;border-radius:10px;background:rgba(0,0,0,0.36);border:1px solid rgba(255,255,255,0.08);padding:10px;color:var(--text);font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, 'Roboto Mono', monospace;font-size:12px}
  .logList{height:220px;overflow:auto;padding:10px;border-radius:10px;background:rgba(0,0,0,0.36);border:1px solid rgba(255,255,255,0.08);color:#bfe8ff;font-family:ui-monospace,monospace;font-size:12px}
  .bm-item{display:flex;justify-content:space-between;gap:8px;padding:6px;border-radius:8px}
  .muted{color:var(--muted)}
  .kbd{background:rgba(255,255,255,0.03);border-radius:6px;padding:4px 6px;font-size:12px;margin-left:6px}
</style>
</head>

<body>
  <div class="container" id="appContainer" role="application" aria-label="Kxsis Proxy Browser">
    <header>
      <div class="logo" aria-hidden="true">KX</div>
      <div>
        <h1>Kxsis Proxy Browser</h1>
        <div class="subtitle">Glass Neo • Robust blob rendering • Fail-safes</div>
      </div>
      <div style="margin-left:auto;color:var(--muted);font-size:13px">v1.2</div>
    </header>

    <div class="controls" id="controlsBar" role="region" aria-label="controls">
      <div class="urlbar" role="search">
        <input id="urlInput" aria-label="Enter URL" placeholder="https://example.com or example.com" />
        <select id="engineSelect" title="Engine" aria-label="Engine selector">
          <option value="auto">Auto (recommended)</option>
          <option value="service">Service (/api/service)</option>
          <option value="raw">Raw (/api/raw)</option>
          <option value="allorigins">AllOrigins</option>
          <option value="croxy">CroxyProxy</option>
          <option value="direct">Direct (CORS)</option>
        </select>
        <select id="renderMode" title="Render mode" aria-label="Render mode">
          <option value="blob">Blob (isolated)</option>
          <option value="iframe">Iframe (raw)</option>
        </select>
        <button id="goBtn" class="btn" title="Go">Go</button>
      </div>

      <div style="display:flex;gap:8px;align-items:center">
        <button id="backBtn" class="mini" title="Back">←</button>
        <button id="forwardBtn" class="mini" title="Forward">→</button>
        <button id="refreshBtn" class="mini" title="Refresh">⟳</button>
        <button id="bookmarkBtn" class="mini" title="Add bookmark">★</button>
      </div>
    </div>

    <div class="main">
      <div>
        <div class="viewer" id="viewer">
          <iframe id="proxyFrame" sandbox="allow-scripts allow-forms allow-same-origin allow-popups allow-downloads" title="Kxsis content frame"></iframe>
          <div id="statusBar" class="status" aria-live="polite"></div>
        </div>

        <div style="margin-top:12px;display:flex;justify-content:space-between;align-items:center">
          <div class="muted">Tips: Use Enter to navigate • Blob mode recommended</div>
          <div class="muted">Engine order: service → raw → allorigins → croxy → direct</div>
        </div>
      </div>

      <aside class="panel" aria-label="Inspector and controls">
        <h3 style="margin:0 0 8px 0">Inspector & Controls</h3>

        <input id="searchInput" placeholder="Search (DuckDuckGo)" style="width:100%;padding:10px;border-radius:10px;background:rgba(0,0,0,0.24);border:1px solid rgba(255,255,255,0.06);color:var(--text)" />

        <div style="display:flex;gap:8px;margin-top:10px">
          <button id="searchBtn" class="mini">Search</button>
          <button id="openNewBtn" class="mini">Open external</button>
          <button id="ytMirrorBtn" class="mini">YouTube Mirror</button>
        </div>

        <div style="margin-top:12px;color:var(--muted)">Source (trimmed)</div>
        <textarea id="sourceBox" readonly placeholder="Fetched source appears here (trimmed)"></textarea>

        <div style="margin-top:12px;display:flex;justify-content:space-between;align-items:center;color:var(--muted)">
          <div>Activity Log</div>
          <div style="display:flex;gap:8px">
            <button id="clearLogs" class="mini">Clear</button>
            <button id="exportLogs" class="mini">Export</button>
          </div>
        </div>

        <div id="logList" class="logList" role="log" aria-live="polite"></div>

        <div style="margin-top:12px;display:flex;justify-content:space-between;align-items:center;color:var(--muted)">
          <div>Bookmarks</div>
          <button id="exportBookmark" class="mini">Export</button>
        </div>
        <div id="bookmarkList" style="margin-top:8px;max-height:150px;overflow:auto"></div>
      </aside>
    </div>
  </div>

<script>
/* Kxsis Frontend — Glass Neo (Dynamic-Fixed Hybrid)
   - Dynamic viewer height: clamps between CSS vh min/max while respecting actual available space
   - Uses ResizeObserver + visualViewport to handle iOS keyboard + orientation changes
   - Safari-safe iframe absolute positioning
   - Engine failover, logging UI, blob rendering & client-side rewrite fallback
*/

/* -------- Utilities & UI elements -------- */
const $ = id => document.getElementById(id);
const LOG_EL = $('logList');
const SOURCE = $('sourceBox');
const STATUS = $('statusBar');
const CONTROLS = $('controlsBar');
const VIEWER = $('viewer');
const IFRAME = $('proxyFrame');

const DEFAULT_TIMEOUT = 20000;
const RETRY_COUNT = 2;

function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[c])); }

function safeLog(obj){
  try{
    const ts = new Date().toISOString();
    const line = typeof obj === 'string' ? obj : JSON.stringify(obj);
    LOG_EL.insertAdjacentHTML('beforeend', `<div>${escapeHtml('['+ts+'] '+line)}</div>`);
    LOG_EL.scrollTop = LOG_EL.scrollHeight;
  }catch(e){ console.error('log append failed', e); }
}
function clearLogs(){ LOG_EL.innerHTML = ''; }
function downloadFile(filename, content){
  const blob = new Blob([content], {type:'text/plain;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; a.click(); URL.revokeObjectURL(a.href);
}
function formatURL(u){ if(!u) return ''; u = u.trim(); return /^\w+:\/\//.test(u) ? u : 'https://' + u; }
function setStatus(text, busy=false){
  STATUS.innerHTML = busy ? `<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent1);margin-right:8px;vertical-align:middle"></span>${escapeHtml(text)}` : escapeHtml(text);
}

/* -------- Engines & endpoints -------- */
const ENGINES = {
  service: (u) => `/api/service?url=${encodeURIComponent(u)}`,
  raw:     (u) => `/api/raw?url=${encodeURIComponent(u)}`,
  resource:(u) => `/api/resource?url=${encodeURIComponent(u)}`,
  allorigins_get: (u) => `https://api.allorigins.win/get?url=${encodeURIComponent(u)}`,
  allorigins_raw: (u) => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
  croxy: (u) => `https://www.croxyproxy.com/embed/?url=${encodeURIComponent(u)}`,
  direct: (u) => u
};

function engineOrder(preferred){
  if(preferred==='service') return ['service','raw','allorigins_raw','croxy','direct'];
  if(preferred==='raw') return ['raw','allorigins_raw','croxy','direct'];
  if(preferred==='allorigins') return ['allorigins_raw','croxy','direct'];
  if(preferred==='croxy') return ['croxy','direct'];
  if(preferred==='direct') return ['direct'];
  return ['service','raw','allorigins_raw','croxy','direct'];
}

/* -------- Fetch helpers (timeout + retry + logs) -------- */
async function fetchWithTimeout(url, opts={}, timeout=DEFAULT_TIMEOUT){
  const controller = new AbortController();
  const tid = setTimeout(()=> controller.abort(), timeout);
  try{
    const res = await fetch(url, {...opts, signal: controller.signal});
    clearTimeout(tid);
    return res;
  }catch(err){
    clearTimeout(tid);
    throw err;
  }
}

async function safeTextFetch(url, opts={}, timeout=DEFAULT_TIMEOUT, retries=1){
  let lastErr = null;
  for(let i=0;i<=retries;i++){
    try{
      const t0 = performance.now();
      const res = await fetchWithTimeout(url, opts, timeout);
      const t1 = performance.now();
      safeLog({event:'fetch', url, status: res.status, ms: Math.round(t1-t0)});
      if(!res.ok) throw new Error('status '+res.status);
      const ct = res.headers.get('content-type') || '';
      const logId = res.headers.get('x-kxsis-logid') || res.headers.get('x-kxsis-log-id') || null;
      const text = await res.text();
      return { res, text, ct, logId };
    }catch(err){
      lastErr = err;
      safeLog({event:'fetch_error', url, err: err && err.message, attempt: i+1});
      await new Promise(r => setTimeout(r, 200*(i+1)));
    }
  }
  throw lastErr;
}

/* -------- Client-side rewrite fallback (AllOrigins) -------- */
function clientRewriteToAllOrigins(htmlText, baseUrl){
  try{
    const parser = new DOMParser();
    const doc = parser.parseFromString(htmlText, 'text/html');

    // remove CSP meta tags
    doc.querySelectorAll('meta[http-equiv],meta[name]').forEach(m=>{
      const he = (m.getAttribute('http-equiv')||'').toLowerCase();
      const name = (m.getAttribute('name')||'').toLowerCase();
      if(he.includes('content-security-policy') || name.includes('content-security-policy') || he.includes('x-frame-options')) m.remove();
    });

    // ensure/overwrite base
    if(!doc.querySelector('base')){
      const baseEl = doc.createElement('base');
      baseEl.setAttribute('href', baseUrl);
      const head = doc.querySelector('head') || doc.documentElement;
      head.insertAdjacentElement('afterbegin', baseEl);
    } else {
      doc.querySelectorAll('base').forEach(b=> b.setAttribute('href', baseUrl));
    }

    const resolve = (rel) => { try { return new URL(rel, baseUrl).href } catch(e){ return rel } };

    // scripts/styles/images rewriting to AllOrigins raw
    doc.querySelectorAll('script[src]').forEach(s=>{
      const src = s.getAttribute('src'); if(!src) return;
      s.setAttribute('src', ENGINES.allorigins_raw(resolve(src)));
      s.removeAttribute('integrity'); s.removeAttribute('crossorigin');
    });
    doc.querySelectorAll('link[rel~="stylesheet"]').forEach(l=>{
      const href = l.getAttribute('href'); if(!href) return;
      l.setAttribute('href', ENGINES.allorigins_raw(resolve(href)));
      l.removeAttribute('integrity'); l.removeAttribute('crossorigin');
    });
    doc.querySelectorAll('img[src]').forEach(img=>{
      const src = img.getAttribute('src'); if(!src) return;
      img.setAttribute('src', ENGINES.allorigins_raw(resolve(src)));
    });
    doc.querySelectorAll('img[srcset], source[srcset]').forEach(el=>{
      const ss = el.getAttribute('srcset'); if(!ss) return;
      const parts = ss.split(',').map(p=>{
        const seg = p.trim().split(/\s+/); const urlpart = seg[0];
        return ENGINES.allorigins_raw(resolve(urlpart)) + (seg.slice(1).length? ' ' + seg.slice(1).join(' ') : '');
      });
      el.setAttribute('srcset', parts.join(', '));
    });

    doc.querySelectorAll('[style]').forEach(el=>{
      const st = el.getAttribute('style')||''; if(st.includes('url(')){
        el.setAttribute('style', st.replace(/url\((['"]?)(.*?)\1\)/g, (m,q,u)=>`url("${ENGINES.allorigins_raw(resolve(u))}")`));
      }
    });
    doc.querySelectorAll('style').forEach(s=>{
      s.textContent = s.textContent.replace(/url\((['"]?)(.*?)\1\)/g, (m,q,u)=>`url("${ENGINES.allorigins_raw(resolve(u))}")`);
    });

    doc.querySelectorAll('a[href]').forEach(a=>{
      const h = a.getAttribute('href'); if(!h) return;
      try{ a.setAttribute('href', new URL(h, baseUrl).href); }catch(e){}
      a.removeAttribute('target');
    });

    // inject nav shim
    const shim = clientNavShim();
    if(doc.body) doc.body.insertAdjacentHTML('beforeend', shim);
    else doc.documentElement.insertAdjacentHTML('beforeend', shim);

    return '<!doctype html>\n' + doc.documentElement.outerHTML;
  }catch(e){
    safeLog({event:'rewrite_client_failed', err: e && e.message});
    throw e;
  }
}
function clientNavShim(){
  return `<script>
(function(){
  function resolveHref(el){ try{ return new URL(el.getAttribute('href')||'', document.baseURI).href }catch(e){ return null } }
  document.addEventListener('click', function(e){
    const a = e.target.closest && e.target.closest('a');
    if(a && a.href){ e.preventDefault(); const href = resolveHref(a); if(href) window.parent.postMessage({type:'kxsis:navigate', href: href}, '*'); }
  }, true);
  document.addEventListener('submit', function(e){
    e.preventDefault();
    const f = e.target;
    const action = f.getAttribute('action') || document.baseURI;
    const method = (f.getAttribute('method') || 'GET').toUpperCase();
    const fd = new FormData(f); const obj={};
    fd.forEach((v,k)=>{ if(obj[k]===undefined) obj[k]=v; else { if(!Array.isArray(obj[k])) obj[k]=[obj[k]]; obj[k].push(v);} });
    if(method==='GET'){ const params = new URLSearchParams(obj).toString(); const url = action + (action.includes('?') ? '&' : '?') + params; window.parent.postMessage({type:'kxsis:navigate', href: url}, '*'); }
    else { window.parent.postMessage({type:'kxsis:post', href: action, method:'POST', body: obj}, '*'); }
  }, true);
  document.querySelectorAll('a[target]').forEach(a=>a.removeAttribute('target'));
  try{ window.parent.postMessage({type:'kxsis:ready', title: document.title || '', url: location.href}, '*'); }catch(e){}
})();
<\/script>`;
}

/* -------- Blob rendering + engine try loop -------- */
let currentBlobUrl = null;
function revokeCurrentBlob(){ if(currentBlobUrl){ try{ URL.revokeObjectURL(currentBlobUrl); }catch(e){} currentBlobUrl = null; } }

function waitForFrameReady(timeout = 4500){
  return new Promise((resolve)=>{
    let done = false;
    const t = setTimeout(()=>{ if(!done){ done=true; window.removeEventListener('message', onmsg); resolve({ok:false, reason:'timeout'}); } }, timeout);
    function onmsg(ev){
      const m = ev.data || {};
      if(m && m.type === 'kxsis:ready'){
        if(!done){ done=true; clearTimeout(t); window.removeEventListener('message', onmsg); resolve({ok:true, info:m}); }
      }
    }
    window.addEventListener('message', onmsg);
  });
}

async function loadURL(raw){
  if(!raw) return;
  const url = formatURL(raw);
  $('urlInput').value = url;
  setStatus('Resolving engine...', true);
  SOURCE.value = '';

  const chosen = $('engineSelect').value;
  const order = engineOrder(chosen);
  safeLog({event:'navigate_start', url, order});

  async function tryEngine(key){
    safeLog({event:'engine_try', engine:key});
    try{
      if(key==='service'){
        const endpoint = ENGINES.service(url);
        const { res, text, ct, logId } = await safeTextFetch(endpoint, {}, DEFAULT_TIMEOUT, RETRY_COUNT);
        safeLog({event:'service_fetched', ct, status: res.status, logId});
        if(!ct.includes('text/html')){ safeLog({event:'service_non_html', ct}); return { ok:false, reason:'non_html' }; }
        revokeCurrentBlob();
        currentBlobUrl = URL.createObjectURL(new Blob([text], {type:'text/html'}));
        IFRAME.sandbox = 'allow-scripts allow-same-origin allow-forms allow-popups allow-downloads';
        IFRAME.src = currentBlobUrl;
        setStatus('Loaded (service blob)', true);
        if(logId) safeLog({event:'server_log_id', logId});
        const ready = await waitForFrameReady(4500);
        if(ready.ok){ setStatus('Ready'); return { ok:true, engine:'service', logId }; }
        safeLog({event:'frame_ready_timeout', engine:'service'});
        return { ok:true, engine:'service', warning:'frame_no_ready' };
      }

      if(key==='raw'){
        const endpoint = ENGINES.raw(url);
        IFRAME.sandbox = 'allow-scripts allow-same-origin allow-forms allow-popups allow-downloads';
        IFRAME.src = endpoint;
        setStatus('Loaded (raw iframe)', true);
        return { ok:true, engine:'raw' };
      }

      if(key==='allorigins_raw'){
        const got = await safeTextFetch(ENGINES.allorigins_get(url), {}, DEFAULT_TIMEOUT, RETRY_COUNT).catch(e=>null);
        if(!got) throw new Error('AllOrigins failed');
        let parsed = null;
        try{ parsed = JSON.parse(got.text); }catch(e){ parsed = null; }
        const contents = parsed && parsed.contents ? parsed.contents : got.text;
        const rewritten = clientRewriteToAllOrigins(contents, url);
        revokeCurrentBlob();
        currentBlobUrl = URL.createObjectURL(new Blob([rewritten], {type:'text/html'}));
        IFRAME.sandbox = 'allow-scripts allow-same-origin allow-forms allow-popups allow-downloads';
        IFRAME.src = currentBlobUrl;
        setStatus('Loaded (AllOrigins blob)', true);
        return { ok:true, engine:'allorigins_raw' };
      }

      if(key==='croxy'){
        IFRAME.sandbox = 'allow-scripts allow-same-origin allow-forms allow-popups allow-downloads';
        IFRAME.src = ENGINES.croxy(url);
        setStatus('Loaded (Croxy embed)', true);
        return { ok:true, engine:'croxy' };
      }

      if(key==='direct'){
        IFRAME.sandbox = 'allow-scripts allow-same-origin allow-forms allow-popups allow-downloads';
        IFRAME.src = ENGINES.direct(url);
        setStatus('Loaded (direct)', true);
        return { ok:true, engine:'direct' };
      }

      return { ok:false, reason:'unknown_engine' };
    }catch(err){
      safeLog({event:'engine_error', engine:key, err: err && err.message});
      return { ok:false, err: err && err.message };
    }
  }

  let lastErr = null;
  for(const e of order){
    const r = await tryEngine(e);
    if(r.ok){
      safeLog({event:'navigate_ok', url, engine:e, info:r});
      setStatus(`Loaded via ${e}`, false);
      // best-effort layout check after short delay
      setTimeout(()=> {
        try{
          const doc = IFRAME.contentDocument || (IFRAME.contentWindow && IFRAME.contentWindow.document);
          if(doc && doc.body && doc.body.innerText && doc.body.innerText.trim().length < 5){
            safeLog({event:'empty_render_detected', engine:e});
          }
        }catch(ex){
          // cross-origin - ignore
        }
      }, 1400);
      return;
    }
    lastErr = r;
  }

  safeLog({event:'navigate_failed', url, lastErr});
  setStatus('Load failed', false);
  SOURCE.value = lastErr && lastErr.err ? 'Error: '+lastErr.err : 'Load failed';
  if(confirm('Automatic failover failed. Open site externally?')) window.open(url,'_blank');
}

/* -------- Message handling from iframe -------- */
window.addEventListener('message', async (ev)=>{
  const m = ev.data || {};
  if(!m || typeof m !== 'object') return;
  if(m.type === 'kxsis:navigate' && m.href){
    await loadURL(m.href);
  } else if(m.type === 'kxsis:post'){
    safeLog({event:'post_from_frame', info:m});
    if(confirm('Form POST requested inside iframe. Open external to submit?')) window.open(m.href,'_blank');
  } else if(m.type === 'kxsis:ready'){
    safeLog({event:'frame_ready', info:m});
    if(m.title) document.title = `Kxsis — ${m.title}`;
  }
});

/* -------- UI wiring & bookmarks & logs -------- */
$('goBtn').addEventListener('click', ()=> loadURL($('urlInput').value));
$('urlInput').addEventListener('keydown', e=> { if(e.key==='Enter') loadURL($('urlInput').value); });
$('searchBtn').addEventListener('click', ()=> { const q = $('searchInput').value.trim(); if(q) loadURL('https://duckduckgo.com/?q='+encodeURIComponent(q)); });
$('openNewBtn').addEventListener('click', ()=> { const u = formatURL($('urlInput').value); if(u) window.open(u,'_blank'); });
$('refreshBtn').addEventListener('click', ()=> { const u = formatURL($('urlInput').value); if(u) loadURL(u); });

let bookmarks = JSON.parse(localStorage.getItem('kxsis:bookmarks')||'[]');
function renderBookmarks(){
  const el = $('bookmarkList'); el.innerHTML='';
  bookmarks.forEach(u=>{
    const d = document.createElement('div'); d.className='bm-item';
    d.innerHTML = `<div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(u)}</div><div style="display:flex;gap:6px"><button class="mini open">Open</button><button class="mini copy">Copy</button></div>`;
    d.querySelector('.open').addEventListener('click', ()=> loadURL(u));
    d.querySelector('.copy').addEventListener('click', ()=> navigator.clipboard.writeText(u));
    el.appendChild(d);
  });
}
$('bookmarkBtn').addEventListener('click', ()=> { const u = formatURL($('urlInput').value); if(u && !bookmarks.includes(u)){ bookmarks.unshift(u); localStorage.setItem('kxsis:bookmarks', JSON.stringify(bookmarks)); renderBookmarks(); }});
$('exportBookmark').addEventListener('click', ()=> { downloadFile('kxsis-bookmarks.json', JSON.stringify(bookmarks, null, 2)); });
renderBookmarks();

$('clearLogs').addEventListener('click', ()=> clearLogs());
$('exportLogs').addEventListener('click', ()=> { downloadFile('kxsis-logs.txt', LOG_EL.innerText || ''); });

function clearSource(){ SOURCE.value = ''; }

/* -------- Dynamic-Fixed Hybrid viewer sizing (the important part) --------
   Behavior:
     - Measure available vertical space below controlsBar and above bottom of container/window
     - Compute clamp between CSS vh min/max (64vh..82vh by default)
     - Apply computed pixel height to viewer element
   This uses:
     - ResizeObserver on the container & controls
     - window resize & orientationchange
     - visualViewport resize events (handles mobile keyboard)
*/
function computeAndSetViewerHeight(){
  try{
    const viewportHeight = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
    const containerRect = document.getElementById('appContainer').getBoundingClientRect();
    const controlsRect = CONTROLS.getBoundingClientRect();
    // Distance from controls bottom to bottom of viewport (available)
    const controlsBottom = controlsRect.bottom;
    // available space = viewport bottom (0..vh) minus controlsBottom minus a safe margin (16px)
    const safeMargin = 24;
    const availPx = Math.max(160, Math.floor(viewportHeight - (controlsBottom - containerRect.top) - safeMargin));
    // clamp based on CSS vh min/max
    const cssMinVh = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--viewer-min-vh')) || 64;
    const cssMaxVh = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--viewer-max-vh')) || 82;
    const minPx = Math.round(window.innerHeight * (cssMinVh / 100));
    const maxPx = Math.round(window.innerHeight * (cssMaxVh / 100));
    const final = Math.max(minPx, Math.min(maxPx, availPx));
    VIEWER.style.height = final + 'px';
  }catch(e){
    console.warn('computeViewerHeight failed', e);
  }
}

let roControls = null;
function attachSizingObservers(){
  // initial compute
  computeAndSetViewerHeight();
  // ResizeObserver on container & controls
  try{
    roControls = new ResizeObserver(()=> computeAndSetViewerHeight());
    roControls.observe(CONTROLS);
    roControls.observe(document.getElementById('appContainer'));
  }catch(e){
    // ignore if ResizeObserver not available
    window.addEventListener('resize', computeAndSetViewerHeight);
  }
  // visualViewport support (mobile keyboard)
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize', computeAndSetViewerHeight, {passive:true});
    window.visualViewport.addEventListener('scroll', computeAndSetViewerHeight, {passive:true});
  }
  // orientation change
  window.addEventListener('orientationchange', ()=> setTimeout(computeAndSetViewerHeight, 120));
  // fallback window resize
  window.addEventListener('resize', computeAndSetViewerHeight);
}

/* Boot: set up sizing and initial navigation */
(function boot(){
  attachSizingObservers();
  const qp = new URLSearchParams(location.search);
  const initial = qp.has('u') ? qp.get('u') : 'https://wikipedia.org';
  $('engineSelect').value = 'auto';
  // schedule an initial compute after load
  window.setTimeout(()=> { computeAndSetViewerHeight(); loadURL(initial); }, 260);
})();
</script>
